{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Log in" %} | E-Learning{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">{% translate "Log in" %}</h1>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="showPasswords" data-show-passwords>
                        <label class="form-check-label" for="showPasswords">{% translate "Show password" %}</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">{% translate "Log in" %}</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    {% translate "New here?" %} <a href="{% url 'accounts:register' %}">{% translate "Create an account" %}</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
